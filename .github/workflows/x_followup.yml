name: X Follow-up Post

# 「3ヶ月前に大量保有報告書が出た銘柄はその後どうなったか」の答え合わせ投稿。
# 速報だけのアカウントに検証を足すための枠（docs/x_post_improvement_1000.md 施策6）。
on:
  schedule:
    # 水曜 21:00 JST（UTC 12:00）。土日の週次2本と離し、週の中日に1本置く。
    - cron: '0 12 * * 3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '本文の生成・表示のみで投稿しない'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv requests-oauthlib Pillow

      - name: Install Noto Sans CJK
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Link repo to ~/stock-alert
        run: |
          rm -f ~/stock-alert
          ln -s $GITHUB_WORKSPACE ~/stock-alert

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > ~/stock-alert/.env
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> ~/stock-alert/.env
          echo "X_API_KEY=${{ secrets.X_API_KEY }}" >> ~/stock-alert/.env
          echo "X_API_KEY_SECRET=${{ secrets.X_API_KEY_SECRET }}" >> ~/stock-alert/.env
          echo "X_ACCESS_TOKEN=${{ secrets.X_ACCESS_TOKEN }}" >> ~/stock-alert/.env
          echo "X_ACCESS_TOKEN_SECRET=${{ secrets.X_ACCESS_TOKEN_SECRET }}" >> ~/stock-alert/.env

      - name: Post follow-up
        run: |
          cd ~/stock-alert
          python web/x_followup.py ${{ inputs.dry_run && '--dry-run' || '' }}
