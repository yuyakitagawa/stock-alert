name: X Weekend Post

on:
  schedule:
    # 土曜 18:00 JST（UTC 09:00）: 急増ランキング（前週比、web/x_weekly_trending.py）
    - cron: '0 9 * * 6'
    # 日曜 18:00 JST（UTC 09:00）: 今週のアクティビストの動き（web/x_weekly_activists.py）
    - cron: '0 9 * * 0'
  workflow_dispatch:
    inputs:
      target:
        description: 'どちらを投稿するか'
        type: choice
        options: [trending, activists]
        default: trending
      dry_run:
        description: '本文の生成・表示のみで投稿しない'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv requests-oauthlib

      - name: Link repo to ~/stock-alert
        run: |
          rm -f ~/stock-alert
          ln -s $GITHUB_WORKSPACE ~/stock-alert

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > ~/stock-alert/.env
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> ~/stock-alert/.env
          echo "X_API_KEY=${{ secrets.X_API_KEY }}" >> ~/stock-alert/.env
          echo "X_API_KEY_SECRET=${{ secrets.X_API_KEY_SECRET }}" >> ~/stock-alert/.env
          echo "X_ACCESS_TOKEN=${{ secrets.X_ACCESS_TOKEN }}" >> ~/stock-alert/.env
          echo "X_ACCESS_TOKEN_SECRET=${{ secrets.X_ACCESS_TOKEN_SECRET }}" >> ~/stock-alert/.env

      # scheduleイベントでは inputs.* が空、workflow_dispatchでは github.event.schedule が空になるため、
      # この2条件のORで「土曜の定期実行 or 手動でtrending指定」を表現できる。
      - name: Post weekly trending (土曜)
        if: github.event.schedule == '0 9 * * 6' || inputs.target == 'trending'
        run: |
          cd ~/stock-alert
          python web/x_weekly_trending.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Post weekly activists (日曜)
        if: github.event.schedule == '0 9 * * 0' || inputs.target == 'activists'
        run: |
          cd ~/stock-alert
          python web/x_weekly_activists.py ${{ inputs.dry_run && '--dry-run' || '' }}
