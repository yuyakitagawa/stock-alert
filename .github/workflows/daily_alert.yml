name: Daily Stock Alert

on:
  schedule:
    - cron: '0 7 * * 1-5'  # 平日7:00 UTC = 平日16:00 JST（市場閉場後・当日終値データで配信）
  workflow_dispatch:       # 手動実行ボタン

permissions:
  contents: read
  actions: write

# ops.yml(watchdog)の誤発火(cronタイムスタンプ計算バグ)等で二重起動した場合でも、
# 同時に2本走ってLINEが二重通知されないようにする（後発は先発の完了までキューで待つ）。
concurrency:
  group: daily-alert
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy scikit-learn joblib \
            python-dotenv openpyxl xlrd xgboost lightgbm \
            yfinance anthropic

      - name: Link repo to ~/stock-alert
        run: |
          rm -f ~/stock-alert
          ln -s $GITHUB_WORKSPACE ~/stock-alert

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> ~/stock-alert/.env
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> ~/stock-alert/.env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> ~/stock-alert/.env
          echo "EDINET_API_KEY=${{ secrets.EDINET_API_KEY }}" >> ~/stock-alert/.env
          echo "LINE_CHANNEL_ACCESS_TOKEN=${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" >> ~/stock-alert/.env
          echo "LINE_USER_ID=${{ secrets.LINE_USER_ID }}" >> ~/stock-alert/.env

      - name: Restore model cache
        id: restore_model_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/rf_drop_model.pkl
          key: rf-drop-model-v1

      - name: Step 0 - 株価キャッシュ更新（Yahoo Finance 差分）
        continue-on-error: true
        run: cd ~/stock-alert && python tools/fetch_history.py --years 1

      # 投資家リターンランキング(/ranking/returns)の集計ビュー。株価キャッシュと
      # EDINET開示の両方に依存するため、Step 0の株価更新の直後に再計算する。
      - name: Step 0b - 投資家リターン集計ビュー更新（Supabase）
        continue-on-error: true
        run: cd ~/stock-alert && python tools/refresh_investor_returns.py

      - name: Step 2b - カタリスト候補スクリーン（EDINET突合用）
        continue-on-error: true
        run: cd ~/stock-alert && python tools/screen_catalyst_candidates.py --min-turnover 500

      # Step 2c（EDINET大量保有スキャン）は edinet_blog.yml（毎時）に移管済み。
      # edinet_large_holdings は Supabase 経由でこのパイプラインからも参照されるため、
      # ランキング生成(Step 3)時点では直近の毎時実行分がそのまま使われる。

      - name: Step 2d - EDINET決算XBRL取得（財務サマリー差分更新）
        continue-on-error: true
        run: cd ~/stock-alert && python tools/fetch_edinet_financials.py --days 7

      - name: Step 2f - TDnet適時開示取得（やのしん・隔離テーブル）
        continue-on-error: true
        run: cd ~/stock-alert && python tools/fetch_tdnet.py --days 3 --catalyst-only

      - name: Step 2g - JPX空売り・信用残取得
        continue-on-error: true
        run: cd ~/stock-alert && python tools/fetch_jpx_market.py

      - name: Step 3 - ランキング生成
        run: cd ~/stock-alert && python core/rank_stocks.py

      - name: Step 4 - Webエクスポート（Supabase）
        run: cd ~/stock-alert && python web/export_to_web.py

      - name: Step 5b - マーケットタイミング＆dpウォッチアラート
        continue-on-error: true
        run: cd ~/stock-alert && python web/market_timing_alert.py

      # Step 5c（ブログ記事自動生成・投稿）は edinet_blog.yml（毎時）に移管済み。

      - name: Step 6 - モデル学習（金曜 or 初回のみ）
        # 配信系(Step1〜5c)より後段に配置。学習が長引いてもアラート配信は既に完了しているため、
        # ここが失敗/タイムアウトしても当日の配信には影響しない。
        continue-on-error: true
        timeout-minutes: 180
        run: |
          DAY=$(date +%u)
          MODEL_PATH=~/stock-alert/rf_drop_model.pkl
          if [ "$DAY" = "5" ] || [ ! -f "$MODEL_PATH" ]; then
            echo "▶ モデル学習を実行します"
            cd ~/stock-alert && python core/rf_train_v3.py
          else
            echo "⏭ モデルが存在するためスキップします"
          fi

      - name: Delete stale model cache
        # GitHub Actions のキャッシュは同一キーを上書きできないため、
        # 保存し直す前に既存分を消す（固定キーで常に最新の1件だけを保持する）
        if: always() && steps.restore_model_cache.outputs.cache-hit == 'true'
        continue-on-error: true
        run: gh cache delete rf-drop-model-v1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Save model cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/rf_drop_model.pkl
          key: rf-drop-model-v1

      - name: 結果をアーティファクトとして保存
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-results-${{ github.run_number }}
          path: |
            data/rankings/ranking_*.csv
            data/screeners/screener_*.csv
            data/catalyst_candidates.csv
          retention-days: 7
