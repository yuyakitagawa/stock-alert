name: Daily Log Review (AIフィードバック)

# 当日のワークフロー実行ログ（daily_alert / edinet_blog / x_post / video_post / ops）を集め、
# Supabaseの成果物スナップショット（X反応・PV・シグナル数）も添えて、Claudeに
# SRE・クオンツ・プロダクト・SEO/GEO・UX/デザイン・バックエンド・フロントエンド・PdM の8観点でレビューさせて
#   全文 → `daily-review` ラベルのIssueにコメント追記（1本を使い回す）+ Actionsのジョブサマリー
#   要約 → LINE push
# を送る。daily_alert の watchdog（ops.yml 14:30 UTC）が再実行した分まで含めるため 15:30 UTC（0:30 JST）に置く。
on:
  schedule:
    - cron: '30 15 * * 1-5'
  workflow_dispatch:
    inputs:
      since_hours:
        description: '何時間前までのrunを対象にするか'
        required: false
        default: '24'
      dry_run:
        description: 'Issue/LINEに送らずサマリーだけ出す'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: daily-log-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv anthropic google-auth

      - name: Review logs with Claude
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          # クリックログ・回遊（GA4）。鍵ファイルは.gitignoreでリポジトリに入れていないため、
          # CIではサービスアカウントJSONをSecretで渡す。未設定ならGA4節だけ「取得不可」になり
          # レビュー自体は従来どおり動く。
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          ARGS="--since-hours ${{ github.event.inputs.since_hours || '24' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python tools/daily_log_review.py $ARGS

      # ジョブが落ちたら必ずLINEへ。ワークフローの赤は誰も見ていないという前提で運用する。
      - name: 失敗をLINE通知
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          pip install --quiet requests
          python -m lib.notify "🚨 Daily Log Review（日次AIレビュー）が失敗しました" \
            --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
