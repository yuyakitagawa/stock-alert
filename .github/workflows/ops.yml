name: Ops (keepalive + watchdog)

# 運用系の小さな定期処理をまとめた1本。
#   平日 06:00 UTC  keepalive : 空コミットでリポジトリを活性状態に保つ（GitHubは60日間コミットが無いと
#                               scheduleワークフローを自動停止するため）。daily_alertの前に走らせる。
#   平日 13:00 UTC  heartbeat : その日の成果物（ブログ記事・X投稿・動画）を数え、欠けていればLINE通知。
#                               ワークフローの成否ではなく成果物を見る（各ワークフローが
#                               continue-on-error で緑のまま無言停止した実例: 2026-08-24）。
#                               この便自体も数時間遅れて起動する（実測: 22:40 UTC＝翌07:40 JST）。
#                               対象日はスクリプト側で決める（正午JSTより前の起動なら前日）。
#   平日 08:00 UTC  watchdog_blog : edinet_blog.yml が今日1本も起動していなければ再実行する。
#                               記事が0件で終わる障害は publish 側のゲート（候補ありで投稿0件なら
#                               ジョブを赤にする）とLINE通知が数分で拾うが、cron自体が不発で
#                               「1本も走らない」ケースはどのワークフローも赤にならず、
#                               22:00 JSTのheartbeatまで13時間気づけなかった。9:00 JSTの初便から
#                               8時間空けた17:00 JSTに置く（scheduleの遅延は実測で最大5時間のため、
#                               これより早いと遅延を不発と誤判定して余計なAPI課金を生む）。
#                               成否ではなく「起動したか」だけを見る（赤で終わった便は上の経路が
#                               既に通知済みで、再実行しても同じ理由で落ちるだけ）。
#   平日 14:30 UTC  watchdog  : daily_alert.yml が今日成功していなければ再実行する。
#                               daily_alertのschedule実行は遅延が多く、実測では予定より最大2〜3時間遅れて
#                               開始する。早い時刻に監視すると「まだ成功していない」と誤判定して二重起動
#                               （LINE二重通知）になるため（実例: 2026-08-03）、確実に完了した後の
#                               23:30 JST に置いている。
on:
  schedule:
    - cron: '0 6 * * 1-5'   # keepalive
    - cron: '0 8 * * 1-5'   # watchdog_blog
    - cron: '0 13 * * 1-5'  # heartbeat
    - cron: '30 14 * * 1-5' # watchdog
  workflow_dispatch:
    inputs:
      job:
        description: 'どれを実行するか'
        type: choice
        options: [watchdog, watchdog_blog, keepalive, heartbeat]
        default: watchdog

jobs:
  keepalive:
    if: github.event.schedule == '0 6 * * 1-5' || inputs.job == 'keepalive'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Keep repository active
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name  "GitHub Actions"
          git commit --allow-empty -m "chore: keepalive [skip ci]"
          git push

  watchdog_blog:
    if: github.event.schedule == '0 8 * * 1-5' || inputs.job == 'watchdog_blog'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Check if edinet blog ran today
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          # 起動の有無だけを見る。conclusion は問わない（赤で終わった便は publish 側のゲートと
          # LINE通知が既に拾っており、同じ理由でもう一度落とすだけになるため）。
          RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/edinet_blog.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.created_at | startswith(\"$TODAY\"))] | length")
          echo "Runs started today: $RUNS"
          if [ "${RUNS:-0}" -gt 0 ]; then
            echo "needs_trigger=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_trigger=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger edinet blog if it never ran today
        if: steps.check.outputs.needs_trigger == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "edinet_blog did not start today. Triggering..."
          gh workflow run edinet_blog.yml --repo "${{ github.repository }}"

      - name: 不発をLINE通知
        if: steps.check.outputs.needs_trigger == 'true'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          pip install --quiet requests
          python -m lib.notify \
            "⚠️ EDINET Blog Hourly が本日1本も起動していません（cron不発の疑い）。手動起動しました" \
            --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/edinet_blog.yml" \
            --dedupe-key "wf_edinet_blog_never_started"

  heartbeat:
    if: github.event.schedule == '0 13 * * 1-5' || inputs.job == 'heartbeat'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      # 異常はスクリプトがLINEへ送る。集計自体に失敗したときだけ例外で落ち、下の通知が飛ぶ。
      - name: 当日の成果物ハートビート（ブログ・X・動画）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          # 素材件数はDBではなくEDINET（上流）から数える。保存が壊れた日を見分けるため。
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python tools/output_heartbeat.py

      - name: 失敗をLINE通知
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python -m lib.notify "🚨 成果物ハートビートが失敗しました（当日の投稿状況を確認できていません）" \
            --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --dedupe-key "wf_ops_heartbeat_failed"

  watchdog:
    if: github.event.schedule == '30 14 * * 1-5' || inputs.job == 'watchdog'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Check if daily alert ran today
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "Checking runs for $TODAY..."
          CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/workflows/daily_alert.yml/runs?per_page=5" \
            --jq ".workflow_runs[] | select(.created_at | startswith(\"$TODAY\")) | .conclusion" \
            | grep -v "^$" | head -1)
          echo "Today's conclusion: '$CONCLUSION'"
          if [ "$CONCLUSION" = "success" ]; then
            echo "needs_trigger=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_trigger=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger daily alert if missing or failed
        if: steps.check.outputs.needs_trigger == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Daily alert not completed today. Triggering..."
          gh workflow run daily_alert.yml --repo "${{ github.repository }}"
