name: EDINET Blog Hourly

on:
  schedule:
    # 平日 9:00-19:00 JST（UTC 0:00-10:00）に毎時実行。株価更新パイプライン(daily_alert.yml)とは
    # 完全に独立。EDINETの提出は全期間の実データで18時以降ゼロ（17時台も17:15の受付終了まで、
    # edinet_large_holdings.submit_dateで確認。2026-08-17）のため、18時の便で当日分が出揃う。
    # 19時の便は取りこぼしの保険＋X日次サマリー（x_client.DAILY_SUMMARY_UTC_HOUR=10）の投稿便。
    - cron: '0 0-10 * * 1-5'
  workflow_dispatch:       # 手動実行ボタン

permissions:
  contents: read

# 前回実行が長引いた場合でも同時に2本走らせず、後発は先発の完了を待ってから実行する
# （edinet_large_holdings/microCMSへの二重書き込み防止）。
concurrency:
  group: edinet-blog
  cancel-in-progress: false

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy python-dotenv \
            anthropic Pillow requests-oauthlib yfinance

      - name: Install Noto Sans CJK (ブログのアイキャッチ画像生成用フォント)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Link repo to ~/stock-alert
        run: |
          rm -f ~/stock-alert
          ln -s $GITHUB_WORKSPACE ~/stock-alert

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > ~/stock-alert/.env
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> ~/stock-alert/.env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> ~/stock-alert/.env
          echo "EDINET_API_KEY=${{ secrets.EDINET_API_KEY }}" >> ~/stock-alert/.env
          echo "MICROCMS_SERVICE_DOMAIN=${{ secrets.MICROCMS_SERVICE_DOMAIN }}" >> ~/stock-alert/.env
          echo "MICROCMS_API_KEY=${{ secrets.MICROCMS_API_KEY }}" >> ~/stock-alert/.env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> ~/stock-alert/.env
          echo "X_API_KEY=${{ secrets.X_API_KEY }}" >> ~/stock-alert/.env
          echo "X_API_KEY_SECRET=${{ secrets.X_API_KEY_SECRET }}" >> ~/stock-alert/.env
          echo "X_ACCESS_TOKEN=${{ secrets.X_ACCESS_TOKEN }}" >> ~/stock-alert/.env
          echo "X_ACCESS_TOKEN_SECRET=${{ secrets.X_ACCESS_TOKEN_SECRET }}" >> ~/stock-alert/.env

      - name: EDINET大量保有スキャン＋突合（イベント蓄積）
        continue-on-error: true
        run: cd ~/stock-alert && python tools/scan_large_holdings.py --days 2

      - name: ブログ記事自動生成・投稿（EDINET大口取引解説「大口投資家の監視ブログ」）
        continue-on-error: true
        run: cd ~/stock-alert && python web/publish_blog_articles.py

      # 概算金額の再計算ブレ等で重複判定をすり抜けた同一開示の二重記事を自動回収する
      # （同一銘柄・同一開示日・同一提出者の後発記事を削除。実例: 2026-08-17）
      - name: 重複記事クリーンアップ
        continue-on-error: true
        run: cd ~/stock-alert && python tools/cleanup_duplicate_blog_articles.py --delete
