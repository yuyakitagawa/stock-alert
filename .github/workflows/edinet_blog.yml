name: EDINET Blog Hourly

on:
  schedule:
    # 平日 9:00 / 15:00 / 18:00 JST（UTC 0 / 6 / 9）の3便。EDINETの提出は全期間の実データで
    # 18時以降ゼロ（17時台も17:15の受付終了まで。edinet_large_holdings.submit_dateで確認、
    # 2026-08-17）なので、18時JSTの便で当日分が出揃う。株価更新パイプライン(daily_alert.yml)
    # とは完全に独立。
    # 2026-08-30に毎時13便（'0 0-12 * * 1-5'）から3便へ減らした。記事は日2本
    # （publish_blog_articles.DAILY_MAX_ARTICLES）に絞ったので毎時走らせても枠を使い切った
    # 便が空回りするだけで、Actionsの実行時間とAPI課金が増える。X投稿（21時JSTの便が担って
    # いた日次サマリー）も同日に停止したため、遅い時間帯の便を残す理由が無くなった。
    - cron: '0 0,6,9 * * 1-5'
    # 取りこぼしbackfill専用の便（1日1回）。時刻ではなく cron 式そのもので分岐させる。
    # GitHubのscheduleは大きく遅延することがあり（実測: 2026-08-27の12:00 UTCの便が16:57に起動）、
    # 実行時の `date -u +%H` で「当日最終便か」を判定するとbackfillが永久にスキップされる。
    # github.event.schedule は起動した cron 式そのものなので、遅延しても取り違えない。
    - cron: '30 12 * * 1-5'
  workflow_dispatch:       # 手動実行ボタン
    inputs:
      backfill_max:
        description: '取りこぼしbackfillの1便あたり投稿上限（空なら既定のBACKFILL_MAX_ARTICLES）'
        required: false

permissions:
  contents: read

# 前回実行が長引いた場合でも同時に2本走らせず、後発は先発の完了を待ってから実行する
# （edinet_large_holdings/microCMSへの二重書き込み防止）。
concurrency:
  group: edinet-blog
  cancel-in-progress: false

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy python-dotenv \
            anthropic Pillow requests-oauthlib yfinance pypdf

      - name: Install Noto Sans CJK (ブログのアイキャッチ・解説図の生成用フォント)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Link repo to ~/stock-alert
        run: |
          rm -f ~/stock-alert
          ln -s $GITHUB_WORKSPACE ~/stock-alert

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > ~/stock-alert/.env
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> ~/stock-alert/.env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> ~/stock-alert/.env
          echo "EDINET_API_KEY=${{ secrets.EDINET_API_KEY }}" >> ~/stock-alert/.env
          echo "MICROCMS_SERVICE_DOMAIN=${{ secrets.MICROCMS_SERVICE_DOMAIN }}" >> ~/stock-alert/.env
          echo "MICROCMS_API_KEY=${{ secrets.MICROCMS_API_KEY }}" >> ~/stock-alert/.env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> ~/stock-alert/.env
          echo "X_API_KEY=${{ secrets.X_API_KEY }}" >> ~/stock-alert/.env
          echo "X_API_KEY_SECRET=${{ secrets.X_API_KEY_SECRET }}" >> ~/stock-alert/.env
          echo "X_ACCESS_TOKEN=${{ secrets.X_ACCESS_TOKEN }}" >> ~/stock-alert/.env
          echo "X_ACCESS_TOKEN_SECRET=${{ secrets.X_ACCESS_TOKEN_SECRET }}" >> ~/stock-alert/.env

      # 以降のステップは continue-on-error で「落ちても後続は動かす」が、最後の
      # 「パイプラインの結果を判定」で outcome を集計してジョブ自体は赤くする。
      # 全部 continue-on-error だけにしていたため run が常に success になり、
      # 開示が1件も保存できていない日もワークフローは緑だった（2026-08-26）。
      - name: EDINET大量保有スキャン＋突合（イベント蓄積）
        id: scan
        continue-on-error: true
        run: cd ~/stock-alert && python tools/scan_large_holdings.py --days 2

      # スキャンで増えた開示にも銘柄ランキング(/trending)の推定売買金額を付ける。
      # 株価・発行済株式数の更新分は daily_alert.yml Step 2e が拾う。
      - name: 推定売買金額ビュー更新（Supabase）
        id: amounts
        continue-on-error: true
        run: cd ~/stock-alert && python tools/refresh_holding_amounts.py

      - name: ブログ記事自動生成・投稿（EDINET大口取引解説「大口投資家の監視ブログ」）
        id: publish_edinet
        continue-on-error: true
        run: cd ~/stock-alert && python web/publish_blog_articles.py

      # 自社株買い決定（TDnet）の記事化。取得枠は daily_alert.yml Step 2f2 と x_post.yml(buyback) が
      # tdnet_buybacks に抽出済み。ここでは当日分の取りこぼしを拾うため抽出も先に回す。
      - name: 自社株買い取得枠の抽出（tdnet_buybacks）
        id: tdnet
        continue-on-error: true
        run: cd ~/stock-alert && python tools/fetch_tdnet.py --days 1 --catalyst-only && python tools/enrich_buybacks.py --days 2

      - name: ブログ記事自動生成・投稿（自社株買い決定・上限10億円以上 or 発行済3%以上）
        id: publish_buyback
        continue-on-error: true
        run: cd ~/stock-alert && python web/publish_buyback_articles.py

      # 稼働が止まっていた期間の取りこぼしを拾い直す（専用cron '30 12 * * 1-5' の便と手動実行のみ）。
      # 通常運転は直近3日の開示しか見ないため、API上限やワークフロー障害で3日を超えて生成が
      # 止まると、その期間の開示は二度と記事化されない（実例: 2026-08-13〜08-20の自社株買い
      # 決定12件を2026-08-27に手作業でbackfillした）。--backfill は30日まで遡り、まだ記事の無い
      # 開示だけを古い順に拾う。1便あたりの投稿数は BACKFILL_MAX_ARTICLES で絞る（API課金と
      # 古い記事が一度に並ぶのを避けるため）。
      - name: 取りこぼし記事のbackfill（1日1回・直近30日）
        id: backfill
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 12 * * 1-5'
        continue-on-error: true
        env:
          # 直接 ${{ }} を run に埋めるとシェルへ注入されるため、環境変数で受けて整数か検証する
          BACKFILL_MAX: ${{ inputs.backfill_max }}
        run: |
          cd ~/stock-alert
          ARG=""
          if [ -n "$BACKFILL_MAX" ]; then
            case "$BACKFILL_MAX" in ''|*[!0-9]*)
              echo "backfill_max は整数で指定してください: $BACKFILL_MAX"; exit 1;;
            esac
            ARG="--max-articles $BACKFILL_MAX"
          fi
          python web/publish_blog_articles.py --backfill $ARG
          python web/publish_buyback_articles.py --backfill $ARG

      # 概算金額の再計算ブレ等で重複判定をすり抜けた同一開示の二重記事を自動回収する
      # （同一銘柄・同一開示日・同一提出者の後発記事を削除。実例: 2026-08-17）
      # 遡りを30日にしているのは、その日の便で回収し損ねた重複が永久に残るのを防ぐため
      # （既定の3日だと翌々日以降は二度と見に行かない）。旧世代の重複は --all で手動回収する。
      - name: 重複記事クリーンアップ
        id: cleanup
        continue-on-error: true
        run: cd ~/stock-alert && python tools/cleanup_duplicate_blog_articles.py --days 30 --delete

      # 個々のステップは continue-on-error で握られているので、ここで outcome を集計して
      # ジョブを赤くする（2026-08-24: ANTHROPIC_API_KEYの月間上限に達し、全便が
      # 「0件処理しました」でsuccessのまま丸1日気付けなかった）。記事化に到達した候補が
      # あるのに投稿0件だった便は publish_ledger が終了コード4を返すのでここで赤くなる。
      # 各スクリプトは原因つきのLINEを自分で送るので、この判定は「赤くする」ことが役目。
      - name: パイプラインの結果を判定
        if: always()
        run: |
          failed=""
          for s in "スキャン:${{ steps.scan.outcome }}" \
                   "推定売買金額:${{ steps.amounts.outcome }}" \
                   "ブログ生成:${{ steps.publish_edinet.outcome }}" \
                   "自社株買い抽出:${{ steps.tdnet.outcome }}" \
                   "自社株買い記事:${{ steps.publish_buyback.outcome }}" \
                   "backfill:${{ steps.backfill.outcome }}" \
                   "重複クリーンアップ:${{ steps.cleanup.outcome }}"; do
            name="${s%%:*}"; outcome="${s##*:}"
            if [ "$outcome" = "failure" ]; then
              echo "::error::$name が失敗しました"
              failed="$failed $name"
            fi
          done
          if [ -n "$failed" ]; then
            echo "失敗したステップ:$failed"
            exit 1
          fi
          echo "全ステップ正常"

      # ジョブが落ちたら必ずLINEへ。ワークフローの赤は誰も見ていないという前提で運用する。
      - name: 失敗をLINE通知
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          pip install --quiet requests
          python -m lib.notify "🚨 EDINET Blog Hourly（ブログ生成）が失敗しました" \
            --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --dedupe-key "wf_edinet_blog_failed"
