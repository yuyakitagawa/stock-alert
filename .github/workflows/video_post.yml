name: Short Video Post

on:
  schedule:
    # 平日 19:30 JST（UTC 10:30）に1日1回。EDINETの提出は18時以降ゼロ（実データ確認済み）で
    # edinet_blog.yml（毎時 9:00-19:00 JST）が19:00の便で当日の記事とX日次サマリーを出し切った
    # あとに走らせ、当日の一番大きい開示を動画にする。YouTubeの夜プライム帯（19〜22時）の頭に乗せる。
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      render_only:
        description: 'mp4の書き出しまでで止める（投稿しない）'
        type: boolean
        default: false
      article_id:
        description: '記事ID指定（記事URL https://kujira-watch.com/articles/xxxx の xxxx。通常の新着×注目枠選定を使わず、この記事を動画にする）'
        type: string
        default: ''

permissions:
  contents: read

# Remotion のレンダリングは重く、二重に走らせる意味が無いため直列化する。
concurrency:
  group: video-post
  cancel-in-progress: false

jobs:
  render-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: video/remotion/package-lock.json

      - name: Install Python dependencies
        # pandas/numpy は株価チャートシーン（lib.utils.get_prices）が使う
        # pillow は YouTube カスタムサムネイル（video/thumbnail.py）の合成に使う
        run: pip install requests anthropic python-dotenv pandas numpy requests-oauthlib pillow

      # ffmpeg は書き出したmp4の音量を配信基準(-14 LUFS)へ正規化するのに必須。
      # Ubuntu 24.04 のランナーイメージには入っていないため明示的に入れる
      # （未インストールのまま無言でスキップされ、-25 LUFS の動画が投稿されていた。2026-08-21）
      - name: Install Noto Sans CJK (動画内の日本語フォント) と ffmpeg
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk ffmpeg

      - name: Install Remotion dependencies
        run: cd video/remotion && npm ci

      # Remotion が使う Chrome Headless Shell（約150MB）を実行間でキャッシュする。
      # キャッシュが無い場合はレンダリング時に自動ダウンロードされる。
      - name: Cache Remotion browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: remotion-browser-${{ runner.os }}

      # ナレーション合成用のVOICEVOXエンジン（ずんだもん）。起動失敗しても
      # publish_video.py 側が無音動画にフォールバックするため continue-on-error にする。
      - name: Start VOICEVOX engine
        continue-on-error: true
        run: |
          docker run -d --name voicevox -p 50021:50021 \
            voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          # エンジンの起動待ち（モデルロードに数十秒かかる）
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:50021/version > /dev/null; then
              echo "VOICEVOX ready"; break
            fi
            sleep 5
          done

      - name: Link repo to ~/stock-alert
        run: |
          rm -f ~/stock-alert
          ln -s $GITHUB_WORKSPACE ~/stock-alert

      - name: Create .env from secrets
        run: |
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" > ~/stock-alert/.env
          echo "MICROCMS_SERVICE_DOMAIN=${{ secrets.MICROCMS_SERVICE_DOMAIN }}" >> ~/stock-alert/.env
          echo "MICROCMS_API_KEY=${{ secrets.MICROCMS_API_KEY }}" >> ~/stock-alert/.env
          # 株価チャートシーン(yahoo_price_cache)・事業内容/投資家プロフィールのキャッシュ参照用
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> ~/stock-alert/.env
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> ~/stock-alert/.env

      - name: 縦動画の生成・投稿（YouTube Shorts）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          # 背景の自然映像（Pexels Videos）。未設定ならグラデーション背景で続行
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # 投稿完了をスマホへ届けるLINE通知
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          cd ~/stock-alert
          EXTRA=""
          if [ -n "${{ inputs.article_id }}" ]; then
            EXTRA="--article-id ${{ inputs.article_id }}"
          fi
          if [ "${{ inputs.render_only }}" = "true" ]; then
            python video/publish_video.py --render-only --keep-video $EXTRA
          else
            python video/publish_video.py --keep-video $EXTRA
          fi

      - name: 生成した動画を成果物として保存（投稿結果の目視確認用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: video/out/
          retention-days: 7
          if-no-files-found: ignore
