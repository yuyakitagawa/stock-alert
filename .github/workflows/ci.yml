name: CI

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy scikit-learn joblib \
            python-dotenv openpyxl xlrd xgboost \
            yfinance pytest anthropic Pillow requests-oauthlib google-auth

      # サムネイル生成テスト(test_video_pipeline.py)は日本語フォントが無いと
      # thumbnail.compose() が None を返して落ちる。edinet_blog.yml / video_post.yml と
      # 同じフォントを入れて、画像生成まで含めて検証する（2026-08-23からCIが赤だった）
      - name: Install Noto Sans CJK (サムネイル生成テスト用フォント)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      # トークンを用意しても、コンポーネント側で場当たりの値を書けば意味が無い。
      # 導入直後に任意値サイズ15箇所・Tailwind標準色6箇所・bg-foreground/10が4箇所
      # 残っていた（2026-08-30）ので機械で落とす。台帳は kujira-watch/docs/design_system.md。
      - name: デザインシステム検査（kujira-watch）
        run: python3 tools/check_design_system.py

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
