name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # デザインシステム検査だけを別ジョブに切り出してPRでも走らせる。
  # check_design_system.py は標準ライブラリだけで動くので pip install もフォントも要らず
  # 数秒で終わる。テスト本体（pytest全件＋画像生成）はPRごとに回すと重いので push のみ。
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: デザインシステム検査（kujira-watch）
        run: python3 tools/check_design_system.py

  test:
    runs-on: ubuntu-latest
    # PRでは design ジョブだけを回す（テスト本体は main への push で走る）。
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy scikit-learn joblib \
            python-dotenv openpyxl xlrd xgboost \
            yfinance pytest anthropic Pillow requests-oauthlib google-auth

      # サムネイル生成テスト(test_video_pipeline.py)は日本語フォントが無いと
      # thumbnail.compose() が None を返して落ちる。edinet_blog.yml / video_post.yml と
      # 同じフォントを入れて、画像生成まで含めて検証する（2026-08-23からCIが赤だった）
      - name: Install Noto Sans CJK (サムネイル生成テスト用フォント)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
