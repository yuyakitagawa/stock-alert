name: X Auth Verify

# X APIのアクセストークンが「実際に」書き込み権限を持っているかを手動で確認する。
# App権限(Read and Write)の設定画面を見ても、権限変更前に発行したトークンは読み取り専用の
# ままで投稿だけが403になるため、v1.1 verify_credentialsのx-access-levelヘッダで
# トークン自体の権限を確かめる（実例: 2026-08-18、日次のX投稿が403で全滅）。
# 投稿は一切行わない（読み取りのみ）。トークン更新後の動作確認に使う。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv requests-oauthlib

      - name: Verify X access token permissions
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python -m web.x_client --verify
